[package]
name = "aicfg-desktop"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alkaid-tech/aicfg"
description = "Local-first management of agent skills, rules, and presets"
readme = "../../README.md"

[lib]
name = "aicfg_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "aicfg-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
percent-encoding = "2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
